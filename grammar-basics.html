<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Grammar Basics</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* Layout: a soft tinted page, one centered column. Home is four colored section cards; each section opens as a raised white card that keeps its own color. Tense colors appear only as dots. */
    :root {
      --bg: #F3F4F9;
      --surface: #FFFFFF;
      --surface2: #F0F2F8;
      --ink: #11131A;
      --muted: #6B7285;
      --line: #E3E6EE;
      --good: #12805A;
      --bad: #C8321F;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 18px 40px -18px rgba(16, 24, 40, .18);
      --s-mix: #3D63F0;
      --s-id: #0E9F8E;
      --s-adv: #C87800;
      --s-qs: #E8456E;
      --sp: #2F5BEA;
      --pc: #0E8F83;
      --wb: #C98A12;
      --spa: #E0622B;
      --pac: #D63C5E;
      --fw: #7B52E8;
      --fg: #BF3FCB;
      --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0C0E13;
        --surface: #151922;
        --surface2: #1D222D;
        --ink: #F1F3F7;
        --muted: #9097A6;
        --line: #272D3A;
        --good: #4FD6A0;
        --bad: #FF8B7A;
        --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -18px rgba(0, 0, 0, .7);
        --s-mix: #8AA4FF;
        --s-id: #4FD1C0;
        --s-adv: #F5B84A;
        --s-qs: #FF7FA0;
        --sp: #7FA0FF;
        --pc: #4FD1C0;
        --wb: #F2B84B;
        --spa: #FF9A62;
        --pac: #FF7A9A;
        --fw: #B79CFF;
        --fg: #E58CF2;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0C0E13;
      --surface: #151922;
      --surface2: #1D222D;
      --ink: #F1F3F7;
      --muted: #9097A6;
      --line: #272D3A;
      --good: #4FD6A0;
      --bad: #FF8B7A;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -18px rgba(0, 0, 0, .7);
      --s-mix: #8AA4FF;
      --s-id: #4FD1C0;
      --s-adv: #F5B84A;
      --s-qs: #FF7FA0;
      --sp: #7FA0FF;
      --pc: #4FD1C0;
      --wb: #F2B84B;
      --spa: #FF9A62;
      --pac: #FF7A9A;
      --fw: #B79CFF;
      --fg: #E58CF2;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(60rem 26rem at 12% -8%, color-mix(in srgb, var(--s-mix) 14%, transparent), transparent 70%), radial-gradient(48rem 24rem at 96% -6%, color-mix(in srgb, var(--s-qs) 12%, transparent), transparent 70%);
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.55;
      padding-block: 44px 72px;
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px))
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 34px
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.7rem, 9vw, 3.9rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -.045em
    }

    .sub {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 40ch
    }

    .mono {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    /* tense dots */
    .t-sp {
      --c: var(--sp)
    }

    .t-pc {
      --c: var(--pc)
    }

    .t-wb {
      --c: var(--wb)
    }

    .t-spa {
      --c: var(--spa)
    }

    .t-pac {
      --c: var(--pac)
    }

    .t-fw {
      --c: var(--fw)
    }

    .t-fg {
      --c: var(--fg)
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px
    }

    .dg {
      display: flex;
      gap: 6px
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--c);
      display: block
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap
    }

    .chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      flex: none
    }

    :focus-visible {
      outline: 2.5px solid var(--ink);
      outline-offset: 3px;
      border-radius: 8px
    }

    /* section colors */
    .s-mix {
      --h: var(--s-mix)
    }

    .s-id {
      --h: var(--s-id)
    }

    .s-adv {
      --h: var(--s-adv)
    }

    .s-qs {
      --h: var(--s-qs)
    }

    .ico {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: var(--h);
      background: color-mix(in srgb, var(--h) 16%, var(--surface))
    }

    /* home menu */
    .home {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-top: 3vh
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px
    }

    @media (max-width:520px) {
      .menu {
        grid-template-columns: 1fr
      }
    }

    .item {
      font: inherit;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 176px;
      padding: 20px;
      border-radius: 26px;
      border: 1px solid color-mix(in srgb, var(--h) 24%, var(--line));
      background: color-mix(in srgb, var(--h) 10%, var(--surface));
      transition: transform .2s, box-shadow .2s
    }

    .item .ico {
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(16, 24, 40, .08)
    }

    .item .ttl {
      margin-top: auto;
      padding-top: 26px;
      padding-right: 44px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.15;
      letter-spacing: -.02em
    }

    .item .dsc {
      margin-top: 4px;
      padding-right: 44px;
      color: var(--muted);
      font-size: .94rem
    }

    .item .arr {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--ink);
      font-size: 1.05rem;
      transition: transform .2s
    }

    .item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow)
    }

    .item:hover .arr {
      transform: translateX(3px)
    }

    @media (max-width:520px) {
      .item {
        min-height: 0
      }

      .item .ttl {
        padding-top: 18px
      }
    }

    /* section view */
    .view {
      display: flex;
      flex-direction: column;
      gap: 26px
    }

    .back {
      font: inherit;
      font-size: .92rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      align-self: flex-start
    }

    .back:hover {
      border-color: var(--ink)
    }

    .vhead {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .vhead h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      line-height: 1.1;
      margin: 0;
      letter-spacing: -.035em
    }

    .vhead .ico {
      width: 52px;
      height: 52px;
      border-radius: 17px
    }

    /* guide */
    details.guide {
      margin: 0
    }

    details.guide summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      font-size: .92rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px
    }

    details.guide summary::-webkit-details-marker {
      display: none
    }

    details.guide summary::after {
      content: "+";
      font-weight: 500;
      color: var(--muted)
    }

    details.guide[open] summary::after {
      content: "\2212"
    }

    details.guide summary:hover {
      border-color: var(--ink)
    }

    .gridg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      padding: 16px 0 6px
    }

    .g {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px
    }

    .g .f {
      font-size: .84rem;
      color: var(--muted);
      margin: 0
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .pill {
      font-size: .86rem;
      background: var(--surface2);
      border-radius: 999px;
      padding: 2px 11px
    }

    .note {
      font-size: .85rem;
      color: var(--muted);
      margin: 8px 0 0;
      max-width: 60ch
    }

    /* exercise card */
    .card {
      display: flex;
      flex-direction: column;
      gap: 26px;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 30px;
      box-shadow: var(--shadow)
    }

    @media (max-width:480px) {
      .card {
        padding: 20px;
        border-radius: 24px
      }
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .head .mono {
      color: var(--muted)
    }

    .head b {
      color: var(--ink);
      font-weight: 600
    }

    .bar {
      height: 7px;
      border-radius: 99px;
      background: var(--surface2);
      overflow: hidden;
      margin-top: -12px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--h);
      border-radius: 99px;
      transition: width .35s
    }

    .link {
      font: inherit;
      font-size: .84rem;
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 0
    }

    .link:hover {
      color: var(--ink)
    }

    .inst {
      margin: 0;
      color: var(--muted);
      font-size: .96rem;
      text-wrap: pretty
    }

    .lead {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.35rem, 3.8vw, 1.8rem);
      line-height: 1.5;
      margin: 0;
      letter-spacing: -.02em;
      text-wrap: pretty
    }

    .lead .verb {
      font-family: var(--mono);
      font-weight: 500;
      font-size: .54em;
      color: var(--h);
      background: color-mix(in srgb, var(--h) 12%, var(--surface));
      border-radius: 8px;
      padding: 2px 8px;
      white-space: nowrap;
      vertical-align: .15em
    }

    .q {
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .blank,
    .line {
      font: inherit;
      color: var(--ink);
      background: var(--surface2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 8px 14px;
      transition: border-color .15s, box-shadow .15s
    }

    .blank {
      font-weight: 600;
      width: 15ch;
      max-width: 100%;
      text-align: center;
      font-size: .88em
    }

    .line {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px 16px
    }

    .line::placeholder {
      color: var(--muted)
    }

    .blank:focus-visible,
    .line:focus-visible {
      outline: 0;
      border-color: var(--h);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--h) 20%, transparent)
    }

    .blank.ok,
    .line.ok {
      border-color: var(--good);
      color: var(--good);
      background: color-mix(in srgb, var(--good) 8%, var(--surface))
    }

    .blank.bad,
    .line.bad {
      border-color: var(--bad);
      color: var(--bad);
      background: color-mix(in srgb, var(--bad) 8%, var(--surface))
    }

    .gap {
      display: inline-block;
      min-width: 5ch;
      border-bottom: 3px solid var(--h);
      text-align: center;
      padding: 0 8px;
      color: var(--muted)
    }

    .gap.ok {
      color: var(--good);
      border-color: var(--good)
    }

    .gap.bad {
      color: var(--bad);
      border-color: var(--bad)
    }

    blockquote.ans {
      margin: 0;
      font-family: var(--display);
      font-size: 1.3rem;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: -.01em;
      text-wrap: pretty;
      background: color-mix(in srgb, var(--h) 8%, var(--surface));
      border-radius: 20px;
      padding: 20px 22px
    }

    mark {
      background: color-mix(in srgb, var(--wb) 34%, transparent);
      color: inherit;
      border-radius: 6px;
      padding: 1px 5px;
      font-weight: 600
    }

    .opts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px
    }

    .opt {
      font: inherit;
      font-size: .97rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      transition: background .15s, border-color .15s, transform .15s
    }

    .opt::before {
      content: "";
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--c, var(--h))
    }

    .opt:hover:not(:disabled) {
      background: color-mix(in srgb, var(--c, var(--h)) 8%, var(--surface));
      border-color: color-mix(in srgb, var(--c, var(--h)) 55%, var(--line));
      transform: translateY(-1px)
    }

    .opt:disabled {
      cursor: default
    }

    .opt.right {
      border-color: var(--good);
      background: color-mix(in srgb, var(--good) 12%, var(--surface))
    }

    .opt.wrong {
      border-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 12%, var(--surface))
    }

    .opts.plain .opt::before {
      display: none
    }

    .fb {
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: .98rem
    }

    .fb.good,
    .fb.bad {
      display: flex;
      padding: 16px 18px;
      border-radius: 18px
    }

    .fb.good {
      background: color-mix(in srgb, var(--good) 11%, var(--surface))
    }

    .fb.bad {
      background: color-mix(in srgb, var(--bad) 10%, var(--surface))
    }

    .fb.good>b:first-child {
      color: var(--good)
    }

    .fb.bad>b:first-child {
      color: var(--bad)
    }

    .fb.good>b:first-child::before {
      content: "\2713\00a0"
    }

    .fb.bad>b:first-child::before {
      content: "\2715\00a0"
    }

    .fb .why {
      color: var(--muted);
      font-size: .92rem
    }

    .fb .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .btn {
      font: inherit;
      font-size: .97rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 13px 28px;
      cursor: pointer;
      border: 1.5px solid var(--ink);
      transition: transform .15s, opacity .15s
    }

    .btn.primary {
      background: var(--ink);
      color: var(--bg)
    }

    .btn.primary:hover {
      transform: translateY(-1px);
      opacity: .9
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line)
    }

    .btn.ghost:hover:not(:disabled) {
      border-color: var(--ink)
    }

    .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .hintbox {
      font-size: .92rem;
      color: var(--muted)
    }

    .done {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: flex-start
    }

    .done h2 {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.05rem;
      margin: 0;
      color: var(--muted)
    }

    .score {
      font-family: var(--display);
      font-weight: 700;
      font-size: 4.6rem;
      line-height: 1;
      margin: 0;
      letter-spacing: -.05em;
      color: var(--h)
    }

    .by {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%
    }

    .by li {
      display: grid;
      grid-template-columns: minmax(0, 13.5rem) 1fr auto;
      align-items: center;
      gap: 14px;
      background: var(--surface2);
      border-radius: 14px;
      padding: 11px 14px
    }

    .by .mb {
      height: 6px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden
    }

    .by .mb i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--c)
    }

    .by .mono {
      font-weight: 500;
      color: var(--muted)
    }

    @media (max-width:480px) {
      body {
        padding-block: 30px 56px
      }

      .by li {
        grid-template-columns: 1fr auto
      }

      .by .mb {
        grid-column: 1 / -1;
        order: 3
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .bar i,
      .opt,
      .item,
      .item .arr,
      .btn,
      .blank,
      .line {
        transition: none
      }

      .item:hover,
      .opt:hover:not(:disabled) {
        transform: none
      }
    }
  </style>
  <style>
    /* extras for this activity */
    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }

    .s-all {
      --h: var(--fw)
    }

    .item.wide {
      grid-column: 1/-1;
      min-height: 130px
    }

    .item .best {
      margin-top: 8px;
      padding-right: 44px;
      color: var(--h);
      font-weight: 500
    }

    @media (max-width:520px) {
      .item.wide {
        min-height: 0
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="home" class="home">
      <header>
        <div class="dots">
          <span class="chip" style="--c:var(--pc)">Afirmativo</span>
          <span class="chip" style="--c:var(--spa)">Negativo</span>
          <span class="chip" style="--c:var(--fw)">Pregunta</span>
        </div>
        <h1>Grammar Basics</h1>
        <p class="sub">Practicá to be, there is/are, can y presente continuo en afirmativo, negativo y pregunta.</p>
      </header>
      <nav class="menu" id="menu" aria-label="Temas"></nav>
    </div>
    <div id="view" class="view" hidden>
      <button class="back" type="button" onclick="home()">&larr; Inicio</button>
      <div class="vhead"><span class="ico" id="vico"></span>
        <h2 id="vtitle"></h2>
      </div>
      <details class="guide" id="guide">
        <summary>Ver la regla</summary>
        <div class="gridg" id="gridg"></div>
      </details>
      <section class="card" id="card"></section>
    </div>
  </div>
  <script>
    /* q: [part, sentence, answer, options]  — options present = multiple choice; otherwise answer is an array of accepted answers to type */
    const T = {
      be: {
        n: "Verb to be (present)", ex: "I am · she is · they are",

          [1, "There ___ any apples. (negative)", "aren't", ["isn't", "aren't", "not are"]],
          [1, "There ___ a TV in my room. (negative)", ["isn't", "is not"]],
          [1, "There ___ any students here. (negative)", ["aren't", "are not"]],
          [2, "___ there a park near here?", ["is"]],
          [2, "___ there any eggs?", ["are"]],
          [2, "Is there a bank? Yes, there ___.", "is", ["is", "are", "isn't"]],
          [2, "Are there any pens? No, there ___.", "aren't", ["isn't", "aren't", "are"]],
          [0, "There ___ a lot of people in the park.", "are", ["is", "are", "be"]],
          [0, "There ___ a pen on the table.", ["is", "'s"]],
          [0, "There ___ five students in my class.", ["are"]],
          [0, "There ___ a big supermarket near my house.", "is", ["is", "are", "isn't"]],
          [1, "There ___ a cinema in my town. (negative)", ["isn't", "is not"]],
          [1, "There ___ any books on the shelf.", "aren't", ["aren't", "isn't", "not is"]],
          [1, "There ___ any water in the bottle. (negative)", ["isn't", "is not"]],
          [1, "There ___ any chairs in the kitchen. (negative)", ["aren't", "are not"]],
          [2, "___ there a bathroom upstairs?", ["is"]],

      },
      can: {

        tip: ["I/you/he/she/we/they <b>can</b> + verb (no -s!)", "<b>can't</b> + verb (can not = cannot)", "<b>Can</b> + subject + verb? Yes, I <b>can</b>. / No, I <b>can't</b>."],
        q: [

          [0, "The children ___ in the garden.", "are playing", ["are playing", "is playing", "plays"]],

          [0, "It ___ now.", "is raining", ["is raining", "rains", "are raining"]],

      }
    };
    T.mix = {c: "var(--ink)", n: "Mix: todos los temas", ex: "32 preguntas de los cuatro temas, mezcladas", q: []};
    Object.keys(T).forEach(k => T[k].q.forEach(q => q.t = k));

    const P = ["Afirmativo", "Negativo", "Pregunta"], PCOL = ["--pc", "--spa", "--fw"];
    const SEC = {be: "s-mix", there: "s-id", can: "s-adv", pc: "s-qs", mix: "s-all"};
    const ICO = {
      be: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
      there: '<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      can: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
      pc: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      mix: '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'
    };
    const svg = (k, s) => `<svg viewBox="0 0 24 24" width="${s || 22}" height="${s || 22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
    const $ = id => document.getElementById(id);
    const norm = s => s.toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, " ").trim();
    const shuf = a => a.map(x => [Math.random(), x]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
    const first = q => Array.isArray(q[2]) ? q[2][0] : q[2];
    const fill = q => q[1].replace("___", "<mark>" + first(q) + "</mark>");
    function best(k) {try {return localStorage.getItem("gp2_" + k)} catch (e) {return null} }
    function saveBest(k, s, n) {try {const b = best(k); if (b === null || s / n > b.split("/")[0] / b.split("/")[1]) localStorage.setItem("gp2_" + k, s + "/" + n)} catch (e) { } }
    let cur, i, score, wrong, locked, qs;

    function home() {
      $("view").hidden = true; $("home").hidden = false; window.scrollTo(0, 0);
      $("menu").innerHTML = Object.keys(T).map(k => {
        const b = best(k);
        return `<button class="item ${SEC[k]}${k === "mix" ? " wide" : ""}" type="button" onclick="openTopic('${k}')"><span class="ico">${svg(k)}</span><span class="ttl">${T[k].n}</span><span class="dsc">${T[k].ex}</span>${b ? `<span class="mono best">Mejor: ${b}</span>` : ""}<span class="arr" aria-hidden="true">&rarr;</span></button>`
      }).join("");
    }
    function openTopic(k) {
      cur = k; $("home").hidden = true; $("view").hidden = false; $("view").className = "view " + SEC[k];
      $("vico").innerHTML = svg(k, 26); $("vtitle").textContent = T[k].n;
      const g = $("guide"); g.hidden = k === "mix"; g.open = true;
      $("gridg").innerHTML = (T[k].tip || []).map((x, j) => `<div class="g"><span class="chip" style="--c:var(${PCOL[j]})">${P[j]}</span><p style="margin:0;font-size:.95rem">${x}</p></div>`).join("");
      $("card").innerHTML = `<p class="inst">${k === "mix" ? "32 preguntas de los cuatro temas, en orden aleatorio." : "24 preguntas: 8 afirmativas, 8 negativas y 8 de pregunta."} Al final vas a ver tu resultado.</p><div class="actions"><button class="btn primary" type="button" onclick="begin()">Empezar</button></div>`;
      window.scrollTo(0, 0);
    }
    function begin() {
      i = 0; score = 0; wrong = []; $("guide").open = false;
      if (cur === "mix") qs = shuf(["be", "there", "can", "pc"].flatMap(k => shuf(T[k].q).slice(0, 8)));
      else qs = shuf(T[cur].q).sort((a, b) => a[0] - b[0]);
      ask();
    }
    function ask() {
      const q = qs[i], n = qs.length, mc = !!q[3];
      const blank = mc ? '<span class="gap" id="gap">&nbsp;</span>' : '<input id="inp" class="blank" style="width:17ch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Tu respuesta" onkeydown="if(event.key===\'Enter\')chk()">';
      $("card").innerHTML = `<div class="head"><span class="mono">Pregunta <b>${i + 1}</b> / ${n}</span><span style="display:flex;gap:8px;align-items:center">${cur === "mix" ? `<span class="pill">${T[q.t].n}</span>` : ""}<span class="chip" style="--c:var(${PCOL[q[0]]})">${P[q[0]]}</span></span></div>
  <div class="bar"><i style="width:${i / n * 100}%"></i></div>
  <div class="q"><p class="inst">${mc ? "Elegí la opción correcta." : "Escribí la palabra o palabras que faltan."}</p>
  <p class="lead">${q[1].replace("___", blank)}</p>
  ${mc ? `<div class="opts plain">${shuf(q[3]).map(o => `<button class="opt" type="button" onclick="pick(this)">${o}</button>`).join("")}</div>` : ""}</div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="actions" id="act" ${mc ? "hidden" : ""}><button class="btn primary" type="button" onclick="chk()">Comprobar</button></div>`;
      locked = false;
      if (!mc) $("inp").focus({preventScroll: true});
    }
    function pick(b) {
      if (locked) return;
      const q = qs[i], ok = norm(b.textContent) === norm(q[2]);
      document.querySelectorAll(".opt").forEach(o => {o.disabled = true; if (norm(o.textContent) === norm(q[2])) o.classList.add("right")});
      if (!ok) b.classList.add("wrong");
      const g = $("gap"); g.textContent = b.textContent; g.classList.add(ok ? "ok" : "bad");
      done(ok);
    }
    function chk() {
      if (locked) return;
      const el = $("inp"), v = norm(el.value);
      if (!v) return;
      const q = qs[i], ok = q[2].some(a => norm(a) === v);
      el.disabled = true; el.classList.add(ok ? "ok" : "bad");
      done(ok);
    }
    function done(ok) {
      locked = true; const q = qs[i];
      if (ok) score++; else wrong.push(q);
      const f = $("fb"); f.className = "fb " + (ok ? "good" : "bad");
      f.innerHTML = ok ? "<b>¡Correcto!</b>" : `<b>Casi</b><span class="why">Respuesta correcta: ${fill(q)}</span>`;
      const a = $("act"); a.hidden = false;
      a.innerHTML = `<button class="btn primary" type="button" onclick="next()">${i === qs.length - 1 ? "Ver resultado" : "Siguiente"}</button>`;
      a.firstChild.focus({preventScroll: true});
    }
    function next() {i++; i < qs.length ? ask() : end()}
    function end() {
      saveBest(cur, score, qs.length);
      const n = qs.length, r = score / n, mix = cur === "mix";
      const m = r === 1 ? "¡Perfecto! Excelente trabajo." : r >= .75 ? "¡Muy bien! Ya casi lo dominás." : r >= .5 ? "Buen intento. Repasá la regla y probá de nuevo." : "Seguí practicando. Repasá la regla y probá de nuevo.";
      const keyOf = mix ? (q => q.t) : (q => q[0]);
      const groups = mix ? [["be", T.be.n, "--s-mix"], ["there", T.there.n, "--s-id"], ["can", T.can.n, "--s-adv"], ["pc", T.pc.n, "--s-qs"]] : [[0, P[0], PCOL[0]], [1, P[1], PCOL[1]], [2, P[2], PCOL[2]]];
      const rows = groups.map(([g, l, c]) => {
        const t = qs.filter(q => keyOf(q) === g).length, ok = t - wrong.filter(q => keyOf(q) === g).length;
        return `<li style="--c:var(${c})"><span>${l}</span><span class="mb"><i style="width:${t ? ok / t * 100 : 0}%"></i></span><span class="mono">${ok}/${t}</span></li>`
      }).join("");
      $("card").innerHTML = `<div class="done"><h2>Resultado</h2><p class="score">${score} / ${n}</p><p class="inst">${m}</p><ul class="by">${rows}</ul>
  ${wrong.length ? `<h2>Para repasar</h2><div class="gridg" style="padding:0;width:100%">${wrong.map(q => `<div class="g">${fill(q)}</div>`).join("")}</div>` : ""}
  <div class="actions"><button class="btn primary" type="button" onclick="begin()">Intentar de nuevo</button><button class="btn ghost" type="button" onclick="home()">Otros temas</button></div></div>`;
      window.scrollTo(0, 0);
    }
    home();
  </script>
